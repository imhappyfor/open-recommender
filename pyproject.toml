[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-recommender"
version = "0.1.0"
description = "Portable user-controlled recommender profiles with hosted sync primitives."
readme = {text = "Portable ORF profiles, signed sync events, and a hosted API foundation.", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42,<46",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
]

[project.scripts]
open-recommender = "open_recommender.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
