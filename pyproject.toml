[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-recommender"
version = "0.1.0"
description = "Portable user-controlled recommender profiles with hosted sync primitives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50.0.2,<51",
  "rfc8785>=0.1.4,<0.2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.scripts]
open-recommender = "open_recommender.cli:main"

[project.urls]
Repository = "https://github.com/imhappyfor/open-recommender"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_recommender = ["schemas/*.json"]
