name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]' 'pip-audit>=2.10.1,<3'
      - run: python -m pip_audit . --strict --progress-spinner off
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm test
        working-directory: sdk/orf-web-sdk
      - run: npm ci
        working-directory: sdk/react-sample-app
      - run: npm audit
        working-directory: sdk/react-sample-app
      - run: npm test
        working-directory: sdk/react-sample-app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: node native/macos/Tests/browser-smoke.mjs

  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: swift test
        working-directory: native/macos
      - run: bash native/macos/build-chrome.sh
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
        working-directory: sdk/react-sample-app
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install '.[dev]'
      - run: node native/macos/Tests/chrome-smoke.mjs
      - run: xcodebuild -project ORFGateway.xcodeproj -scheme 'ORF Gateway' -configuration Debug -derivedDataPath /tmp/orf-gateway-build CODE_SIGNING_ALLOWED=NO build
        working-directory: native/macos
